name: Verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: pytest -q
      - run: python scripts/create_local_env.py
      - run: docker compose --profile api up -d --wait db rest gateway
      - run: bash scripts/db/migrate.sh
      - run: docker compose exec -T db psql -U postgres -d antutor -v ON_ERROR_STOP=1 < supabase/seed/concepts.sql
      - run: docker compose exec -T db psql -U postgres -d antutor -v ON_ERROR_STOP=1 < supabase/seed/concepts.example.sql
      - run: docker compose restart rest
      - run: python tests/integration/run_api_check.py
      - if: always()
        run: docker compose --profile api down -v
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    env:
      # Disposable loopback-only test services; never deployment credentials.
      LOCAL_DB_PASSWORD: ci-disposable-postgres
      LOCAL_NEO4J_PASSWORD: ci-disposable-graph
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait db
      - run: bash scripts/db/migrate.sh
      - run: bash scripts/db/migrate.sh
      - run: docker compose exec -T db psql -U postgres -d antutor -v ON_ERROR_STOP=1 < supabase/seed/concepts.sql
      - run: docker compose exec -T db psql -U postgres -d antutor -v ON_ERROR_STOP=1 < supabase/seed/concepts.sql
      - run: docker compose exec -T db psql -U postgres -d antutor -v ON_ERROR_STOP=1 < tests/sql/schema_checks.sql
      - if: always()
        run: docker compose down -v
  graph:
    runs-on: ubuntu-latest
    env:
      LOCAL_DB_PASSWORD: ci-disposable-postgres
      LOCAL_NEO4J_PASSWORD: ci-disposable-graph
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: ci-disposable-graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install neo4j python-dotenv
      - run: docker compose up -d neo4j
      - run: |
          export SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')
          python tests/integration/check_neo4j.py
      - if: always()
        run: docker compose down -v
